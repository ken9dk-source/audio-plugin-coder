<body>
<h2>&#128208; QuadraFuzz Knob Layout Editor</h2>
<div id="hint">Trak de rode bokse sa de sidder CENTRERET pa baggrundsknapperne &bull; Koordinaterne opdateres live</div>
<div id="scene">
  <div class="kn" id="k0" data-name="Low   " style="left:37px;top:49px"></div>
  <div class="kn" id="k1" data-name="LowMid" style="left:117px;top:49px"></div>
  <div class="kn" id="k2" data-name="HiMid " style="left:197px;top:49px"></div>
  <div class="kn" id="k3" data-name="High  " style="left:277px;top:49px"></div>
  <div class="kn" id="k4" data-name="Gain  " style="left:37px;top:133px"></div>
  <div class="kn" id="k5" data-name="Output" style="left:277px;top:133px"></div>
</div>

<div id="coords">
  <h3>Koordinater (kopi disse ind i gen_qf2.py):</h3>
  <pre id="out">...</pre>
  <button id="copy-btn" onclick="copyCoords()">Kopier til udklipsholder</button>
  <span id="copied">Kopieret!</span>
</div>

<script>
const scene = document.getElementById('scene');
const knobs = Array.from(document.querySelectorAll('.kn'));
let drag = null;

function getPos(el) {
  return { l: parseInt(el.style.left)||0, t: parseInt(el.style.top)||0 };
}

function updateDisplay() {
  const pos = knobs.map(k => getPos(k));
  const bkx = pos.slice(0,4).map(p => p.l);
  const bky  = pos[0].t;
  const bky2 = pos[4].t;
  const gx   = pos[4].l;
  const ox   = pos[5].l;
  const oy   = pos[5].t;

  const lines = knobs.map((k,i) => {
    const p = pos[i];
    const cx = p.l + 24, cy = p.t + 24;
    return k.dataset.name + ':  left=' + String(p.l).padStart(3) +
           '  top=' + String(p.t).padStart(3) +
           '  (center ' + cx + ',' + cy + ')';
  });

  lines.push('');
  lines.push('# Til gen_qf2.py:');
  lines.push('BKX  = [' + bkx.join(', ') + ']');
  lines.push('BKY  = ' + bky + '   # oeverste raekke');
  lines.push('BKY2 = ' + bky2 + '  # nederste raekke');
  lines.push('GX, GY = ' + gx + ', ' + bky2);
  lines.push('OX, OY = ' + ox + ', ' + oy);

  document.getElementById('out').textContent = lines.join('\n');
}

function copyCoords() {
  const text = document.getElementById('out').textContent;
  navigator.clipboard.writeText(text).then(() => {
    const el = document.getElementById('copied');
    el.style.opacity = '1';
    setTimeout(() => el.style.opacity = '0', 2000);
  });
}

// Drag using pointermove (no capture needed for in-browser use)
knobs.forEach(kn => {
  kn.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    const sr = scene.getBoundingClientRect();
    const kr = kn.getBoundingClientRect();
    drag = {
      kn,
      offX: e.clientX - kr.left,
      offY: e.clientY - kr.top,
      sceneLeft: sr.left,
      sceneTop:  sr.top
    };
    kn.classList.add('dragging');
    kn.setPointerCapture(e.pointerId);
    e.preventDefault();
  });

  kn.addEventListener('pointermove', e => {
    if (!drag || drag.kn !== kn) return;
    let l = e.clientX - drag.sceneLeft - drag.offX;
    let t = e.clientY - drag.sceneTop  - drag.offY;
    l = Math.max(-2, Math.min(684, l));
    t = Math.max(-2, Math.min(167, t));
    kn.style.left = Math.round(l) + 'px';
    kn.style.top  = Math.round(t) + 'px';
    updateDisplay();
  });

  kn.addEventListener('pointerup', e => {
    if (drag && drag.kn === kn) {
      kn.classList.remove('dragging');
      kn.releasePointerCapture(e.pointerId);
      drag = null;
    }
  });

  kn.addEventListener('lostpointercapture', () => {
    kn.classList.remove('dragging');
    if (drag && drag.kn === kn) drag = null;
  });
});

updateDisplay();
</script>
